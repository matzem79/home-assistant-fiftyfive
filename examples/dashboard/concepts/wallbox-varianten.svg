nden Daten „Nicht verfügbar“.</text><text x="32" y="815" font-size="13" fill="#74808b" style="fill:#74808b">Akkuanzeige kommt aus dem Fahrzeug. Der Energiefluss zeigt ausschließlich die bekannte Strecke Wallbox → Auto.</text></svg>