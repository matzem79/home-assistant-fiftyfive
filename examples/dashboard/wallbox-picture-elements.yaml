  - type: state-icon
    entity: button.50five_laden_start
    icon: mdi:play
    title: Laden start
    state_color: false
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.50five_laden_start
    hold_action:
      action: more-info
    style:
      left: '33%'
      top: '35%'
      transform: translate(-50%, -50%)
      color: '#15803d'
      background-color: 'rgba(255, 255, 255, 0.94)'
      border-radius: 50%
      padding: 10px
      --mdc-icon-size: 24px
