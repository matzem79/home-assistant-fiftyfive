# Persönliche Karte mit den Entity-IDs der wallbox-Installation.
type: picture-elements
title: Wallbox Einfahrt
image: /local/images/homeAdvanced.png
elements:
  - type: conditional
    conditions:
      - entity: sensor.wallbox_charger_status
        state: 'Laden'
    elements:
      - type: icon
        icon: mdi:circle
        tap_action:
          action: more-info
          entity: sensor.wallbox_charger_status
        style:
          left: '38.8%'
          top: '9.25%'
          transform: translate(-50%, -50%)
          color: blue
          --mdc-icon-size: 14px
  - type: conditional
    conditions:
      - entity: sensor.wallbox_charger_status
        state: 'Bereit'
    elements:
      - type: icon
        icon: mdi:circle
        tap_action:
          action: more-info
          entity: sensor.wallbox_charger_status
        style:
          left: '38.8%'
          top: '9.25%'
          transform: translate(-50%, -50%)
          color: yellow
          --mdc-icon-size: 14px
  - type: conditional
    conditions:
      - entity: sensor.wallbox_charger_status
        state: 'Laden (voll)'
    elements:
      - type: icon
        icon: mdi:circle
        tap_action:
          action: more-info
          entity: sensor.wallbox_charger_status
        style:
          left: '38.8%'
          top: '9.25%'
          transform: translate(-50%, -50%)
          color: limegreen
          --mdc-icon-size: 14px
  - type: conditional
    conditions:
      - entity: sensor.wallbox_charger_status
        state: 'Transaktion abschließen'
    elements:
      - type: icon
        icon: mdi:circle
        tap_action:
          action: more-info
          entity: sensor.wallbox_charger_status
        style:
          left: '38.8%'
          top: '9.25%'
          transform: translate(-50%, -50%)
          color: orange
          --mdc-icon-size: 14px
  - type: conditional
    conditions:
      - entity: sensor.wallbox_charger_status
        state_not: 'Laden'
      - entity: sensor.wallbox_charger_status
        state_not: 'Bereit'
      - entity: sensor.wallbox_charger_status
        state_not: 'Laden (voll)'
      - entity: sensor.wallbox_charger_status
        state_not: 'Transaktion abschließen'
    elements:
      - type: icon
        icon: mdi:circle
        tap_action:
          action: more-info
          entity: sensor.wallbox_charger_status
        style:
          left: '38.8%'
          top: '9.25%'
          transform: translate(-50%, -50%)
          color: gray
          --mdc-icon-size: 14px
  - type: state-label
    entity: sensor.wallbox_charger_status
    prefix: ''
    tap_action:
      action: more-info
    style:
      left: '64%'
      top: '10%'
      transform: translate(0, -50%)
      color: '#17212b'
      background-color: 'rgba(255, 255, 255, 0.94)'
      border-radius: 8px
      padding: 6px 8px
      font-size: 12px
      font-weight: 500
      box-sizing: border-box
      width: '34%'
      white-space: normal
      overflow-wrap: anywhere
  - type: state-label
    entity: sensor.wallbox_card_in_use
    prefix: 'Karte: '
    tap_action:
      action: more-info
    style:
      left: '64%'
      top: '19%'
      transform: translate(0, -50%)
      color: '#17212b'
      background-color: 'rgba(255, 255, 255, 0.94)'
      border-radius: 8px
      padding: 6px 8px
      font-size: 12px
      font-weight: 500
